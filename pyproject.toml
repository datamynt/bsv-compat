[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bsv-compat"
version = "0.1.0"
description = "Established (non-BRC) open BSV protocols for Python — Bitcom (B/MAP/AIP), BSM, paymail"
readme = "README.md"
license = {text = "Open BSV License"}
requires-python = ">=3.10"
keywords = ["bsv", "bitcom", "bitcoin-schema", "B", "MAP", "AIP", "BSM", "paymail", "op_return"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "bsv-sdk>=2.1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/datamynt/bsv-compat"
Issues = "https://github.com/datamynt/bsv-compat/issues"

[tool.hatch.build.targets.sdist]
include = ["src/bsv_compat", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = [".venv*", "venv", "build", "dist", "**/__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["src/bsv_compat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
